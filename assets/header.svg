<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="t">
  <title id="t">Hey, I'm Abilio. Software Developer, AI and LLM applications. Computer Science at Mackenzie, São Paulo.</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: in .5s ease-out forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2.1s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  </style>
  <defs>
    <radialGradient id="g" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#27272a"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="219" rx="14" fill="#09090b" stroke="#27272a"/>
  <rect x="1" y="1" width="838" height="218" rx="14" fill="url(#dots)"/>
  <rect class="glow" x="1" y="1" width="838" height="218" rx="14" fill="url(#g)"/>
  <circle cx="26" cy="26" r="5" fill="#3f3f46"/><circle cx="44" cy="26" r="5" fill="#3f3f46"/><circle cx="62" cy="26" r="5" fill="#3f3f46"/>
  <text x="90" y="30" class="mono" font-size="12" fill="#71717a">~/abiliocoe-source</text>

  <g class="line l1"><text x="40" y="78" class="mono" font-size="15" fill="#34d399">$ <tspan fill="#a1a1aa">whoami</tspan></text></g>
  <g class="line l2"><text x="40" y="124" class="sans" font-size="38" font-weight="700" fill="#f4f4f5">Hey, I'm Abilio<tspan fill="#34d399">.</tspan></text></g>
  <g class="line l3"><text x="40" y="160" class="sans" font-size="18" fill="#d4d4d8">Software Developer <tspan fill="#52525b">|</tspan> AI &amp; LLM Applications</text></g>
  <g class="line l4"><text x="40" y="192" class="mono" font-size="13" fill="#71717a">Computer Science @ Mackenzie · São Paulo, BR <tspan class="cursor" fill="#34d399">▍</tspan></text></g>
</svg>
